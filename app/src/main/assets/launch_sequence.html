<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CryptoCycles 2126 — Quantum Launch Sequence</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Syne:wght@700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Space Grotesk', sans-serif;
      background-color: #05050f;
      color: #e2e8f0;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }
    .font-syne { font-family: 'Syne', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }

    @keyframes quantumSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes counterSpin {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }
    @keyframes pulseCore {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 15px rgba(0, 245, 255, 0.4)); }
      50% { transform: scale(1.06); filter: drop-shadow(0 0 30px rgba(0, 245, 255, 0.85)); }
    }
    @keyframes scanProgress {
      0% { width: 0%; }
      30% { width: 38%; }
      70% { width: 82%; }
      100% { width: 100%; }
    }
    @keyframes flickerGlow {
      0%, 100% { opacity: 0.85; }
      50% { opacity: 1; }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) scale(0.8); opacity: 0; }
      50% { opacity: 0.8; }
      100% { transform: translateY(-80px) scale(1.2); opacity: 0; }
    }

    .animate-spin-quantum {
      animation: quantumSpin 6s linear infinite;
    }
    .animate-counter-spin {
      animation: counterSpin 9s linear infinite;
    }
    .animate-pulse-core {
      animation: pulseCore 2.4s ease-in-out infinite;
    }
    .animate-bar {
      animation: scanProgress 3.5s cubic-bezier(0.16, 1, 0.3, 1) infinite;
    }
    .bg-void {
      background: radial-gradient(circle at center, #0e0922 0%, #05050f 75%, #020208 100%);
    }
    .hologram-glass {
      background: rgba(20, 18, 30, 0.75);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(0, 245, 255, 0.25);
      box-shadow: 0 0 35px -5px rgba(0, 245, 255, 0.18), inset 0 0 20px rgba(121, 40, 202, 0.2);
    }
  </style>
</head>
<body class="min-h-screen flex justify-center items-center bg-black p-0 sm:p-4">
  <!-- Mobile Device Frame Container (390px) -->
  <div class="w-full max-w-[390px] h-[844px] max-h-screen bg-void flex flex-col relative border-x border-[#232033] shadow-[0_0_80px_rgba(0,245,255,0.12)] overflow-hidden justify-between select-none">
    
    <!-- Top System Telemetry Bar -->
    <div class="w-full px-5 pt-4 flex items-center justify-between text-[10px] font-mono text-[#64748b] z-20 border-b border-[#232033]/40 pb-2.5">
      <div class="flex items-center space-x-2">
        <span class="inline-block w-2 h-2 rounded-full bg-[#00ff88] shadow-[0_0_8px_#00ff88] animate-ping"></span>
        <span class="text-[#00f5ff] font-bold tracking-wider">ENTANGLEMENT: 99.999%</span>
      </div>
      <div class="flex items-center space-x-1.5 text-[9px]">
        <span class="text-[#c084fc] font-semibold">CHRONO-QUANTUM</span>
        <span class="text-[#334155]">//</span>
        <span class="text-[#94a3b8]">PORT 0x01</span>
      </div>
    </div>

    <!-- Center Stage: The 2126 Holographic Quantum Reactor & Emblem -->
    <div class="flex-1 flex flex-col items-center justify-center relative px-6 z-10 -mt-6">
      
      <!-- Ambient Radial Backlight Glow -->
      <div class="absolute w-72 h-72 rounded-full bg-gradient-to-tr from-[#00f5ff]/15 via-[#7928ca]/20 to-transparent blur-3xl pointer-events-none"></div>

      <!-- Outer Multi-Layer Orbital Gyroscope -->
      <div class="relative w-56 h-56 flex items-center justify-center">
        
        <!-- Outer Ring 1: Cyan/Mauve Sweep Gradient with Satellite Node -->
        <div class="absolute inset-0 rounded-full border border-dashed border-[#00f5ff]/30 animate-spin-quantum">
          <div class="absolute -top-1.5 left-1/2 -translate-x-1/2 w-3 h-3 rounded-full bg-[#00f5ff] shadow-[0_0_12px_#00f5ff]"></div>
          <div class="absolute -bottom-1.5 left-1/2 -translate-x-1/2 w-2 h-2 rounded-full bg-[#c084fc] shadow-[0_0_8px_#c084fc]"></div>
        </div>

        <!-- Outer Ring 2: Counter Rotating Reticle Ring with Epoch Markers -->
        <div class="absolute inset-3 rounded-full border border-[#7928ca]/35 animate-counter-spin">
          <div class="absolute top-1/2 -left-1.5 -translate-y-1/2 w-2.5 h-2.5 rounded-full bg-[#00ff88] shadow-[0_0_10px_#00ff88]"></div>
          <div class="absolute top-1/2 -right-1.5 -translate-y-1/2 w-2 h-2 rounded-full bg-[#00f5ff]"></div>
        </div>

        <!-- Compass Cardinal Marks (North/South/East/West) -->
        <div class="absolute inset-0 flex items-center justify-between px-1 pointer-events-none opacity-40">
          <span class="text-[8px] font-mono text-[#00f5ff]">W</span>
          <span class="text-[8px] font-mono text-[#00f5ff]">E</span>
        </div>
        <div class="absolute inset-0 flex flex-col items-center justify-between py-1 pointer-events-none opacity-40">
          <span class="text-[8px] font-mono text-[#00f5ff]">N</span>
          <span class="text-[8px] font-mono text-[#00f5ff]">S</span>
        </div>

        <!-- Central Hologram Card Core (CC Monogram) -->
        <div class="w-24 h-24 rounded-3xl hologram-glass flex flex-col items-center justify-center relative animate-pulse-core cursor-pointer border border-[#00f5ff]/60">
          <!-- Cyber Corner Markers -->
          <div class="absolute top-1.5 left-1.5 w-2 h-2 border-t-2 border-l-2 border-[#00f5ff]"></div>
          <div class="absolute top-1.5 right-1.5 w-2 h-2 border-t-2 border-r-2 border-[#00f5ff]"></div>
          <div class="absolute bottom-1.5 left-1.5 w-2 h-2 border-b-2 border-l-2 border-[#c084fc]"></div>
          <div class="absolute bottom-1.5 right-1.5 w-2 h-2 border-b-2 border-r-2 border-[#c084fc]"></div>

          <!-- Glowing Monogram Logo -->
          <span class="font-syne font-black text-3xl tracking-tighter text-transparent bg-clip-text bg-gradient-to-r from-[#00f5ff] via-white to-[#00ff88]">
            CC
          </span>
          <span class="text-[7.5px] font-mono font-bold tracking-widest text-[#00f5ff]/80 uppercase mt-0.5">
            ENTANGLED
          </span>
        </div>
      </div>

      <!-- App Title & Identity -->
      <div class="mt-8 text-center space-y-1.5">
        <h1 class="font-syne font-black text-2xl tracking-[0.25em] text-white">
          CRYPTOCYCLES
        </h1>
        <p class="font-mono text-[10.5px] font-bold tracking-[0.2em] text-[#00f5ff] uppercase">
          QUANTUM SUB-SPACE COMMAND
        </p>
        <p class="text-[11px] font-mono text-[#94a3b8] tracking-tight pt-1">
          4D Halving Fractals &bull; Deep Space Telemetry
        </p>
      </div>

      <!-- Live Initialization Telemetry Sequence -->
      <div class="w-full max-w-[260px] mt-9 space-y-3">
        <!-- Laser Progress Bar -->
        <div class="w-full h-1.5 rounded-full bg-[#1c1a26] border border-[#2e2a3f] overflow-hidden p-0.5 relative">
          <div class="h-full rounded-full bg-gradient-to-r from-[#00f5ff] via-[#00ff88] to-[#c084fc] animate-bar shadow-[0_0_12px_#00f5ff]"></div>
        </div>

        <!-- Real-Time Terminal Log Feed -->
        <div class="flex flex-col items-center space-y-1 text-center font-mono">
          <div class="flex items-center space-x-2 text-[10px] text-[#00ff88] font-bold">
            <span class="w-1.5 h-1.5 rounded-full bg-[#00ff88] animate-ping"></span>
            <span id="boot-status">WARP SYNAPSE: 0.001PS // CONNECTED</span>
          </div>
          <span class="text-[9px] text-[#64748b]">CALIBRATING TENSOR MEMPOOL // EPOCH 33</span>
        </div>
      </div>
    </div>

    <!-- Bottom Security & Hardware Rig Badge -->
    <div class="w-full px-6 py-4 bg-[#0f0d18]/90 border-t border-[#232033] flex items-center justify-between text-[10px] font-mono text-[#64748b] z-20">
      <div class="flex items-center space-x-1.5">
        <span class="text-[#00f5ff]">🔒</span>
        <span>ZERO-KYC COLD LINK</span>
      </div>
      <div class="flex items-center space-x-1.5 text-[#cbd5e1]">
        <span class="text-[#00ff88]">●</span>
        <span class="font-semibold">STABLE KERNEL</span>
      </div>
    </div>

    <!-- Interactive Ambient Click Simulation -->
    <script>
      const stages = [
        "INITIALIZING QUANTUM CORE...",
        "WARP SYNAPSE: 0.001PS // CONNECTED",
        "ENTANGLEMENT VERIFIED: 99.999%",
        "LOADING 4D FRACTAL CYCLE NODES...",
        "CRYPTOCYCLES QUANTUM // LAUNCHING"
      ];
      let i = 0;
      const statusEl = document.getElementById("boot-status");
      setInterval(() => {
        i = (i + 1) % stages.length;
        if(statusEl) statusEl.innerText = stages[i];
      }, 900);
    </script>
  </div>
</body>
</html>
